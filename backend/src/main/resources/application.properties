spring.application.name=facturacion-hexagonal
spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=${MONGODB_DATABASE:facturacion_productos}
spring.mongodb.username=${MONGODB_USERNAME:}
spring.mongodb.password=${MONGODB_PASSWORD:}
spring.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:admin}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
