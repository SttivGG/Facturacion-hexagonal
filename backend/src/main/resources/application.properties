spring.application.name=facturacion-hexagonal
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:facturacion_ventas}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${MYSQL_USER:facturacion_app}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jackson.deserialization.accept-float-as-int=false
spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=${MONGODB_DATABASE:facturacion_productos}
spring.mongodb.username=${MONGODB_USERNAME:}
spring.mongodb.password=${MONGODB_PASSWORD:}
spring.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:admin}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
spring.cassandra.contact-points=${CASSANDRA_HOST:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_DATACENTER:datacenter1}
spring.cassandra.keyspace-name=facturacion_personas
spring.cassandra.schema-action=none
spring.cassandra.request.timeout=10s
spring.cassandra.connection.connect-timeout=10s
spring.cassandra.connection.init-query-timeout=10s
spring.cassandra.request.consistency=local_quorum
spring.cassandra.request.serial-consistency=local_serial
