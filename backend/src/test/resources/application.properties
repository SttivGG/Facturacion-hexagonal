# Las pruebas locales no necesitan MongoDB; la integración real se ejecuta con Docker.
app.mongodb.initialize=false
spring.datasource.url=jdbc:h2:mem:facturacion;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jackson.deserialization.accept-float-as-int=false
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=facturacion_test
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
