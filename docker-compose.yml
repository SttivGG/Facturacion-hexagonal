name: facturacion-hexagonal

# Infraestructura académica opcional; no es una dependencia de Nexo.
x-druid: &druid
  image: apache/druid:38.0.0
  profiles: [analytics]
  env_file:
    - ./infrastructure/druid/common.env
  restart: unless-stopped
  stop_grace_period: 60s
  healthcheck:
    test: ["CMD-SHELL", 'wget -q -T 4 -O - "http://127.0.0.1:$${DRUID_HEALTH_PORT}/status/health" | grep -qx true']
    interval: 15s
    timeout: 6s
    start_period: 90s
    retries: 20
  networks:
    - facturacion-interna

x-druid-environment: &druid-environment
  # El valor por defecto es solo un ejemplo local; configurar .env antes de iniciar.
  DRUID_METADATA_PASSWORD: ${DRUID_METADATA_PASSWORD:-cambiar_druid_solo_desarrollo}
  # /druid.sh imprime propiedades al arrancar: usar un proveedor evita imprimir la clave.
  druid_metadata_storage_connector_password: '{"type":"environment","variable":"DRUID_METADATA_PASSWORD"}'
  DRUID_XMS: 64m

services:
  facturacion-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      facturacion-backend:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - facturacion-interna

  facturacion-backend:
    # Docker Desktop puede iniciar el grupo sin esperar los healthchecks de Compose.
    restart: "on-failure:5"
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      # MongoDB: catálogo y GridFS. Cassandra: personas. MySQL: facturas y pagos.
      MONGODB_HOST: ${MONGODB_HOST:-facturacion-mongodb}
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: ${MONGODB_DATABASE:-facturacion_productos}
      MONGODB_USERNAME: ${MONGODB_USERNAME:?Define MONGODB_USERNAME en .env}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?Define MONGODB_PASSWORD en .env}
      MONGODB_AUTH_DATABASE: admin
      CASSANDRA_HOST: ${CASSANDRA_HOST:-facturacion-cassandra}
      CASSANDRA_PORT: "9042"
      CASSANDRA_DATACENTER: datacenter1
      MYSQL_HOST: ${MYSQL_HOST:-facturacion-mysql}
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-facturacion_ventas}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      DRUID_ENABLED: ${DRUID_ENABLED:-false}
      DRUID_BASE_URL: ${DRUID_BASE_URL:-http://druid-router:8888}
      DRUID_SYNC_INTERVAL: ${DRUID_SYNC_INTERVAL:-PT1M}
      DRUID_HTTP_TIMEOUT: ${DRUID_HTTP_TIMEOUT:-PT10S}
      DRUID_TASK_TIMEOUT: ${DRUID_TASK_TIMEOUT:-PT8M}
      DRUID_MAX_REQUEST_BYTES: ${DRUID_MAX_REQUEST_BYTES:-1000000}
      ML_ENABLED: ${ML_ENABLED:-false}
      ML_DEMO_ENABLED: ${ML_DEMO_ENABLED:-false}
      ML_BASE_URL: ${ML_BASE_URL:-http://facturacion-ml:8000}
      ML_HTTP_TIMEOUT: ${ML_HTTP_TIMEOUT:-PT10S}
    depends_on:
      facturacion-mongodb:
        condition: service_healthy
      facturacion-cassandra:
        condition: service_healthy
      facturacion-cassandra-init:
        condition: service_completed_successfully
      facturacion-mysql:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - facturacion-interna

  facturacion-ml:
    profiles: [ml]
    build:
      context: ./services/ml-api
    environment:
      ML_MODEL_DIR: /data
      ML_DEMO_ENABLED: ${ML_DEMO_ENABLED:-false}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - ml-model-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - facturacion-interna

  facturacion-mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-facturacion_productos}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:?Define MONGODB_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Define MONGODB_PASSWORD en .env}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - 127.0.0.1
        - --eval
        - 'const admin = db.getSiblingDB("admin"); admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD); if (admin.runCommand({ping: 1}).ok !== 1) quit(1);'
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 10
    mem_limit: 768m
    networks:
      - facturacion-interna

  facturacion-cassandra:
    image: cassandra:4.1.12
    environment:
      CASSANDRA_CLUSTER_NAME: FacturacionCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "127.0.0.1", "9042", "-e", "SELECT release_version FROM system.local;"]
      interval: 20s
      timeout: 15s
      start_period: 120s
      retries: 15
    mem_limit: 2g
    stop_grace_period: 60s
    networks:
      - facturacion-interna

  facturacion-cassandra-init:
    image: cassandra:4.1.12
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        intento=0
        until cqlsh facturacion-cassandra 9042 -f /schema/001-personas.cql; do
          intento=$$((intento + 1))
          if [ "$$intento" -ge 20 ]; then exit 1; fi
          sleep 3
        done
    volumes:
      - ./infrastructure/cassandra:/schema:ro
    depends_on:
      facturacion-cassandra:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    networks:
      - facturacion-interna

  facturacion-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-facturacion_ventas}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=50"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --connect-timeout=5 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1"'
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 15
    mem_limit: 768m
    networks:
      - facturacion-interna

  druid-metadata:
    image: postgres:17.6-alpine
    profiles: [analytics]
    environment:
      POSTGRES_DB: druid
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: ${DRUID_METADATA_PASSWORD:-cambiar_druid_solo_desarrollo}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - druid-metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid -d druid"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped
    networks:
      - facturacion-interna

  druid-zookeeper:
    image: zookeeper:3.9.4
    profiles: [analytics]
    environment:
      ZOO_STANDALONE_ENABLED: "true"
      ZOO_ADMINSERVER_ENABLED: "false"
      ZOO_4LW_COMMANDS_WHITELIST: ruok
      ZOO_MAX_CLIENT_CNXNS: "60"
      JVMFLAGS: "-Xms32m -Xmx64m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2"
    volumes:
      - druid-zookeeper-data:/data
      - druid-zookeeper-log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 3 127.0.0.1 2181 | grep -qx imok"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
    mem_limit: 192m
    restart: unless-stopped
    networks:
      - facturacion-interna

  druid-coordinator:
    <<: *druid
    # nano-quickstart ejecuta Coordinator y Overlord en el mismo proceso.
    command: [coordinator]
    environment:
      <<: *druid-environment
      druid_host: druid-coordinator
      DRUID_HEALTH_PORT: "8081"
      DRUID_XMX: 256m
      DRUID_MAXDIRECTMEMORYSIZE: 64m
    volumes:
      - druid-shared:/opt/shared
      - druid-coordinator-var:/opt/druid/var
    depends_on:
      druid-metadata:
        condition: service_healthy
      druid-zookeeper:
        condition: service_healthy
    mem_limit: 512m

  druid-broker:
    <<: *druid
    command: [broker]
    environment:
      <<: *druid-environment
      druid_host: druid-broker
      DRUID_HEALTH_PORT: "8082"
      DRUID_XMX: 256m
      DRUID_MAXDIRECTMEMORYSIZE: 128m
    volumes:
      - druid-broker-var:/opt/druid/var
    depends_on:
      druid-coordinator:
        condition: service_healthy
    mem_limit: 576m

  druid-historical:
    <<: *druid
    command: [historical]
    environment:
      <<: *druid-environment
      druid_host: druid-historical
      DRUID_HEALTH_PORT: "8083"
      DRUID_XMX: 256m
      DRUID_MAXDIRECTMEMORYSIZE: 128m
      druid_segmentCache_locations: '[{"path":"var/druid/segment-cache","maxSize":"1g"}]'
      druid_cache_sizeInBytes: 16MiB
    volumes:
      - druid-shared:/opt/shared
      - druid-historical-var:/opt/druid/var
    depends_on:
      druid-coordinator:
        condition: service_healthy
    mem_limit: 576m

  druid-middlemanager:
    <<: *druid
    command: [middleManager]
    environment:
      <<: *druid-environment
      druid_host: druid-middlemanager
      DRUID_HEALTH_PORT: "8091"
      DRUID_XMX: 64m
      DRUID_MAXDIRECTMEMORYSIZE: 64m
    volumes:
      - druid-shared:/opt/shared
      - druid-middlemanager-var:/opt/druid/var
    depends_on:
      druid-coordinator:
        condition: service_healthy
    # MiddleManager + the controller/worker pair of ONE sequential MSQ ingestion.
    mem_limit: 1152m

  druid-router:
    <<: *druid
    command: [router]
    environment:
      <<: *druid-environment
      druid_host: druid-router
      DRUID_HEALTH_PORT: "8888"
      DRUID_XMX: 128m
      DRUID_MAXDIRECTMEMORYSIZE: 64m
      druid_router_http_numMaxThreads: "10"
    ports:
      - "127.0.0.1:${DRUID_PORT:-8888}:8888"
    volumes:
      - druid-router-var:/opt/druid/var
    depends_on:
      druid-broker:
        condition: service_healthy
      druid-historical:
        condition: service_healthy
      druid-middlemanager:
        condition: service_healthy
    mem_limit: 320m

networks:
  facturacion-interna:
    driver: bridge

volumes:
  ml-model-data:
  mongodb-data:
  cassandra-data:
  mysql-data:
  druid-metadata-data:
  druid-zookeeper-data:
  druid-zookeeper-log:
  druid-shared:
  druid-coordinator-var:
  druid-broker-var:
  druid-historical-var:
  druid-middlemanager-var:
  druid-router-var:
